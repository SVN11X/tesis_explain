name: Verificar sitio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # registros en orden aunque la salida no sea una terminal
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias solo de desarrollo
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Datos, índice y enlaces
        run: python herramientas/verificar_sitio.py
      - name: Ejemplos sintéticos y figuras de respaldo al día
        run: |
          node herramientas/ejemplos_laboratorio.js --comprobar
          node herramientas/diagramas_plano.js --comprobar
      - name: Modelos numéricos
        run: |
          node herramientas/pruebas_unitarias.js
          node herramientas/pruebas_control.js
          node herramientas/pruebas_mapeo.js
          node herramientas/pruebas_slam_proceso.js
          node herramientas/pruebas_movimiento.js
          node herramientas/pruebas_analisis.js
          node herramientas/pruebas_estabilidad.js
          node herramientas/pruebas_estadistica.js
      - name: Navegador
        run: |
          python herramientas/pruebas_control_navegador.py
          python herramientas/pruebas_mapeo_navegador.py
          python herramientas/pruebas_movimiento_navegador.py
          python herramientas/pruebas_laboratorio_navegador.py
          python herramientas/pruebas_robustez_navegador.py
          python herramientas/pruebas_evidencia_navegador.py
          python herramientas/pruebas_navegador.py
          python herramientas/pruebas_experiencia_navegador.py
