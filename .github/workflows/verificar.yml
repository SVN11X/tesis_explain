name: Verificar sitio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # registros en orden aunque la salida no sea una terminal
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias solo de desarrollo
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Instalar y compilar
        run: |
          npm ci
          npm run build
      - name: Generadores al día
        run: |
          python scripts/datos.py --comprobar
          python scripts/catalogo_defensa.py --comprobar
          python scripts/descarga_preguntas.py --comprobar
          python scripts/imagen_social.py --comprobar
          python scripts/indice.py --comprobar
          node scripts/ejemplos_laboratorio.js --comprobar
          node scripts/diagramas_plano.js --comprobar
          node scripts/diagramas_mapeo.js --comprobar
          node scripts/diagramas_control.js --comprobar
      - name: Datos, índice y enlaces del sitio compilado
        run: python scripts/verificar_sitio.py
      - name: Tipos y pruebas de la experiencia Astro y Svelte
        run: |
          npm run check
          npm run test:lidar
      - name: Pruebas del servicio, el catálogo y la validación
        run: npm test
      - name: Modelos numéricos
        run: |
          node tests/pruebas_unitarias.js
          node tests/pruebas_control.js
          node tests/pruebas_mapeo.js
          node tests/pruebas_slam_proceso.js
          node tests/pruebas_movimiento.js
          node tests/pruebas_analisis.js
          node tests/pruebas_estabilidad.js
          node tests/pruebas_estadistica.js
      - name: Navegador
        run: |
          python tests/navegador_control.py
          python tests/navegador_mapeo.py
          python tests/navegador_movimiento.py
          python tests/navegador_laboratorio.py
          python tests/navegador_robustez.py
          python tests/navegador_evidencia.py
          python tests/navegador.py
          python tests/navegador_experiencia.py
          python tests/navegador_redisenio.py
          python tests/navegador_defensa.py
