name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install -r scripts/requisitos.txt
          npm ci
      # Los tres archivos de voz de más de 5 MB no están en git: se restauran de la caché o se descargan
      - name: Restaurar los archivos de voz
        uses: actions/cache@v4
        with:
          path: public/voz
          key: voz-${{ hashFiles('public/voz/manifiesto.json') }}
      - name: Descargar los archivos de voz que falten
        run: python scripts/descargar_voz.py
      - name: Comprobar las huellas de voz (si no coinciden, no se publica)
        run: python scripts/descargar_voz.py --comprobar
      - name: Compilar el sitio en dist/
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
